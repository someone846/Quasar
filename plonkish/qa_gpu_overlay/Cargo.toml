[package]
name = "qa-gpu-overlay"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
default = []
cuda = []

[dependencies]
plonkish_backend = { path = "../plonkish_backend" }
rand_chacha = "0.3"
rayon = "1.10"

[[bin]]
name = "qa_encode_cpu_gpu"
path = "src/bin/qa_encode_cpu_gpu.rs"
required-features = ["cuda"]

[[bin]]
name = "qa_commit_cpu_cuda"
path = "src/bin/quasar_commit_cpu_cuda.rs"
required-features = ["cuda"]

[[bin]]
name = "matmul_bench_gpu"
path = "src/bin/matmul_bench_gpu.rs"
required-features = ["cuda"]
